description = "SHIP — checklist rilis, CI/CD, observability, go/no-go + archive spec ke docs/specs/archive/ bila todo 100%"

prompt = """
Invoke shipping-and-launch as orchestrator, with ci-cd-and-automation, observability-and-instrumentation, and git-workflow-and-versioning as needed. Scoped to docs/specs/.

Active spec resolution: if docs/specs/active/ has one folder, use it as <spec-id>; if multiple, ask which <spec-id> to ship (single-choice). Read docs/specs/active/<spec-id>/prd.md + implementation-plan.md + todo.md for context. The spec being shipped is <spec-id>.

1. Verify VERIFY and REVIEW are green for this <spec-id> — if not, stop and complete them first. Check that tests + build pass and no Critical review findings remain unaddressed.
2. Run shipping-and-launch pre-launch checklist for this spec: env vars, migrations, monitoring/alerting, feature flags, docs/README/CHANGELOG, rollback plan. Produce GO / NO-GO with blockers, fixes, acknowledged risks, and a rollback procedure (trigger + exact steps + RTO).
3. Ensure CI/CD is ready via ci-cd-and-automation (GitHub Actions / PM2 / build pipeline) — no broken workflows, build passes on CI.
4. Ensure observability via observability-and-instrumentation (logging, metrics, tracing, alerting) so production behavior is diagnosable after launch.
5. Follow git-workflow-and-versioning for release: clean atomic commits, conventional messages, tagging / version bump, and PR hygiene.
6. If any Critical blocker exists, default verdict is NO-GO unless user explicitly accepts risk. Never ship without an explicit rollback plan.

7. ARCHIVE GATE (wajib — ini yang memindahkan spec yang sudah selesai):
   After a successful GO (or after user explicitly accepts remaining risks), inspect docs/specs/active/<spec-id>/todo.md:
   - If EVERY checkbox is [x] (no "- [ ]" remains) → move the entire folder: git mv docs/specs/active/<spec-id> docs/specs/archive/<spec-id>
     If docs/specs/archive/<spec-id> already exists, use docs/specs/archive/<spec-id>-v2 (or next suffix). Also move its implementation-plan.md + prd.md together — they travel as a unit.
     Commit the move: "docs(specs): archive <spec-id> — todos 100% (via /ship)"
   - If ANY checkbox is still [ ] → do NOT archive. Leave docs/specs/active/<spec-id>/ in place and tell user: "masih ada <N> todo unchecked — selesaikan dulu atau centang manual, baru /ship akan archive."
   - Never archive a spec that still has unchecked todos, even if user says GO — GO without archive is allowed (code ships, docs stay active).

Rules: all specs live under docs/specs/active/ while in progress and only move to docs/specs/archive/ via this gate; never manually move; never archive from /build or /verify.
"""
