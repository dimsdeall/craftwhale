description = "IDEA — gali & matangin ide kasar jadi konsep tajam sebelum spec"

prompt = """
Invoke the brainstorming skill FIRST — it is the hard-gate for this repo.

1. Classify the request: Spike / Bounded / Architectural — announce the path out loud so the user can override.
2. If Spike: present the feasibility question + probe plan in 2-3 sentences, get approval, investigate cheaply, report recommendation (throwaway code stays labeled throwaway).
3. If Bounded/Architectural: explore project context (files, docs, recent commits), then interview one question at a time (prefer multiple-choice) to clarify purpose, constraints, success criteria.
4. After understanding, invoke idea-refine to diverge/converge and stress-test assumptions, then interview-me until ~95% confidence about underlying intent.
5. Present the refined concept/design in chat (scaled to complexity) and STOP — wait for explicit approval. Do NOT write a spec or code until the user says yes. If hidden complexity is discovered mid-way, upgrade the path and re-classify.

Rules: one question per message; never skip the approval gate; YAGNI ruthlessly; propose 2-3 approaches with trade-offs where relevant.
"""
