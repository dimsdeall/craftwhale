description = "EXPLAIN-CODE — explain architecture, schema, and features (read-only, optional) — saves to docs/ when requested"

prompt = """
Optional explain command — does NOT modify code. Read-only. Explains architecture, schema, and features. All saved outputs live under docs/.

Skills it orchestrates (invoke conditionally — one or more, never all blindly):
- improve-codebase-architecture — codebase architecture & deep-module opportunities
- database-schema-designer — database / data-model schema (tables, relations, ERD)
- write-feature-docs — feature documentation from existing code

Flow:
1. Determine what user wants explained. If "architecture" → (a) Architecture; "schema"/"ERD"/"database"/"tables" → (b) Schema; "feature"/"features" → (c) Feature docs. If ambiguous, ask one question with 3 choices:
   (a) Architecture — module structure, seams, deep vs shallow, hot spots
   (b) Schema — data model / DB schema / relations / ERD (Mermaid)
   (c) Feature — list & explain existing features
   Default if unsure: (a) then offer (b)/(c). Multiple choices allowed.

2. Explore read-only — do not edit code:
   - (a): follow improve-codebase-architecture §1 Explore — scope via git log hot spots or user-named module, read docs/CONSTRAINTS.md (or CONSTRAINTS.md legacy) + docs/specs/active/*/prd.md + ADRs in docs/adr/, spawn sub-agent to walk codebase and note friction (shallow modules, leaky seams, missing locality, untested seams, deletion test). Use codebase-design vocabulary — never "component/service/API/boundary".
   - (b): follow database-schema-designer — locate schema files (Prisma/Drizzle/SQL/migrations), extract tables/relations/constraints, render Mermaid ERD + checklist from references/schema-design-checklist.md.
   - (c): follow write-feature-docs — scan docs/specs/active/*/prd.md and docs/specs/archive/*/prd.md + routes/modules to enumerate features, then produce structured feature docs.

3. Present:
   - (a) Architecture: write self-contained HTML to $TMPDIR/architecture-review-<timestamp>.html (Tailwind CDN + Mermaid CDN, before/after visuals per candidate, files/problem/solution/benefits/badge, Top recommendation), open it (xdg-open/open/start) and share absolute path. Also summarize in chat. Additionally, if user asks to save, write markdown snapshot to docs/explain/architecture-<YYYY-MM-DD>.md. Do NOT propose interfaces yet — ask "Which would you like to explore?" and enter grilling loop only if user picks one.
   - (b) Schema: Mermaid ERD + tables/columns/relations + checklist compliance note. Keep in chat; if user asks to save, write to docs/explain/schema-<YYYY-MM-DD>.md or docs/schema.md (ask which).
   - (c) Feature: markdown per-feature (purpose, entry points, key files, data flow, dependencies). Keep in chat; if user asks to save, write to docs/explain/features-<YYYY-MM-DD>.md or docs/features.md (ask which).

4. Stay read-only. No code changes, no migrations, no refactors. If user wants to act on findings, point to /spec → /plan → /build. All saved explain outputs live under docs/explain/ (or docs/ root for schema/features if user prefers) — never at repo root or under docs/specs/.
"""
