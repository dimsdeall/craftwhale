description = "EXPLAIN-CODE — jelaskan arsitektur, skema, dan fitur codebase (read-only, opsional)"

prompt = """
Optional explain command — does NOT modify code. Read-only. Explains architecture, schema, and features of an existing codebase.

Skills it orchestrates (invoke conditionally — one or more, never all blindly):
- improve-codebase-architecture — codebase architecture & deep-module opportunities
- database-schema-designer — database / data-model schema (tables, relations, ERD)
- write-feature-docs — feature documentation from existing code

Flow:
1. Determine what the user wants explained. If they said "arsitektur" → architecture; "skema"/"schema"/"ERD"/"database"/"tabel" → schema; "fitur"/"feature"/"apa aja yang ada" → feature docs. If ambiguous, ask one question with 3 choices:
   (a) Architecture — struktur modul, seams, deep vs shallow modules, hot spots
   (b) Schema — data model / DB schema / relations / ERD (Mermaid)
   (c) Feature — daftar & penjelasan fitur yang sudah ada di codebase
   Default if unsure: (a) then offer (b)/(c). Multiple choices allowed.

2. Explore read-only — do not edit code:
   - For (a): follow improve-codebase-architecture Process §1 Explore — scope via git log hot spots or user-named module, read CONTEXT.md + ADRs, spawn a sub-agent to walk the codebase and note friction (shallow modules, leaky seams, missing locality, untested seams, deletion test). Use codebase-design vocabulary (module/interface/depth/seam/adapter/leverage/locality) — never "component/service/API/boundary".
   - For (b): follow database-schema-designer — locate schema files (Prisma/Drizzle/SQL/migrations), extract tables/relations/constraints, render Mermaid ERD + table checklist from references/schema-design-checklist.md.
   - For (c): follow write-feature-docs — scan PRODUCT.md / TECH.md / routes / modules to enumerate features, then produce structured feature docs.

3. Present:
   - (a) Architecture: write a self-contained HTML report to $TMPDIR/architecture-review-<timestamp>.html (Tailwind CDN + Mermaid CDN, before/after visuals per candidate, files/problem/solution/benefits/badge, Top recommendation), open it (xdg-open/open/start) and share the absolute path. Also summarize in chat. Do NOT propose interfaces yet — ask "Which of these would you like to explore?" and enter the grilling loop only if the user picks one.
   - (b) Schema: Mermaid ERD + table of tables/columns/relations + checklist compliance note. Keep as markdown in chat or docs/schema.md if user asks to save.
   - (c) Feature: markdown feature docs (per-feature: purpose, entry points, key files, data flow, dependencies). Save to docs/features.md only if user explicitly asks.

4. Stay read-only. No code changes, no migrations, no refactors. If the user wants to act on the findings, point them to /spec → /plan → /build.

Rules: never skip the "what to explain" clarification; scope via hot spots when no direction given; use CONTEXT.md terms for the domain; if a candidate contradicts an ADR, surface only when friction warrants reopening (mark with warning callout).
"""
