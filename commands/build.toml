description = "BUILD — incremental build with TDD one slice per commit for active spec"

prompt = """
Invoke incremental-implementation alongside test-driven-development. All planning artifacts live under docs/specs/active/<spec-id>/.

Modes (select via args; "auto" or "all" = autonomous):
- /build — implement the next pending task from the active spec's todo.md, then stop.
- /build auto — autonomous loop over the active spec's todos.

Active spec resolution (must be unambiguous):
- If docs/specs/active/ has exactly one folder with a todo.md that still has unchecked boxes (- [ ]), use it as <spec-id>.
- If multiple actives have unchecked todos, ASK which <spec-id> to build (single-choice list) — do NOT guess.
- If none has unchecked todos, tell user "no active spec with pending todos — run /spec + /plan first" and stop.

Default (/build — one task):
1. Read docs/specs/active/<spec-id>/todo.md (canonical) — pick next unchecked task. Also read its prd.md + implementation-plan.md for context. Load relevant code patterns/types.
2. RED: write a failing test for the acceptance criteria.
3. GREEN: implement minimum code to pass.
4. Run full test suite for regressions + run build to verify compilation.
5. Commit with conventional message (e.g. "feat(<spec-id>): <task title>"); mark that task [x] in docs/specs/active/<spec-id>/todo.md; stop. Update todo.md in the same commit so progress is tracked.

Autonomous (/build auto):
1. Resolve <spec-id> as above; require its prd.md and todo.md. If none, stop and ask for /spec.
2. Check git status — if uncommitted changes outside docs/specs/ exist, ask to commit/stash/confirm.
3. If no todo.md for that spec, invoke planning-and-task-breakdown to generate docs/specs/active/<spec-id>/todo.md (and implementation-plan.md) via /plan flow.
4. Present the full todo list for that <spec-id> and wait for unambiguous affirmative (approve/go/yes) — hedged is NOT approved. Commit the plan as preparatory commit.
5. Execute every unchecked task in dependency order, running RED→GREEN→regression→build→commit loop per task. Stage only files that task touched + docs/specs/active/<spec-id>/todo.md update; one commit per task.
6. Stop and ask (do not push through) if: test/build can't pass, spec is ambiguous, or task is high-risk/irreversible (auth, destructive migration, payments, deletions, deploys, secrets) — follow debugging-and-error-recovery or doubt-driven-development and get explicit sign-off. Re-invoke /build auto to resume.
7. Summarize: <spec-id>, tasks completed, tests added, commits made, remaining unchecked, skipped/flagged items.

Collision note: if during build a new /spec request arrives that touches overlapping files/modules (from the new PRD's Requirements), /spec's collision guard will handle it (Gabung/Pisah/Tunda) — do NOT auto-merge. Archive happens only in /ship when all todos for that <spec-id> are [x] — never during /build.

Invoke api-and-interface-design or frontend-ui-engineering when the slice touches those surfaces.
"""
